<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Uplift Faces - Lip Sync Test</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
      }

      canvas {
        border: 1px solid #ccc;
        margin-top: 30px;
      }

      #openness {
        font-size: 24px;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <h1>Uplift Faces</h1>

    <p>Upload a speech audio file.</p>

    <input type="file" id="audioFile" accept="audio/*" />

    <br /><br />

    <audio id="audio" controls></audio>

    <canvas id="canvas" width="400" height="300"></canvas>

    <div id="openness">Openness: 0.00</div>

    <script src="/lipSync.js"></script>

    <script>
      const audio = document.getElementById("audio");
      const audioFile = document.getElementById("audioFile");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const opennessText = document.getElementById("openness");

      const spritePaths = [
        "/assets/street-vendor/street_vendor_closed.png",
        "/assets/street-vendor/street_vendor_half.png",
        "/assets/street-vendor/street_vendor_open.png",
      ];

      const sprites = spritePaths.map((path) => {
        const image = new Image();
        image.src = path;
        return image;
      });

      let lipSync;

      function drawFace(openness) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let spriteIndex;

        if (openness < 0.34) {
          spriteIndex = 0;
        } else if (openness < 0.67) {
          spriteIndex = 1;
        } else {
          spriteIndex = 2;
        }

        const sprite = sprites[spriteIndex];

        if (!sprite.complete || !sprite.naturalWidth) {
          return;
        }

        const maxWidth = 260;
        const maxHeight = 285;

        const scale = Math.min(
          maxWidth / sprite.naturalWidth,
          maxHeight / sprite.naturalHeight
        );

        const width = sprite.naturalWidth * scale;
        const height = sprite.naturalHeight * scale;

        const x = (canvas.width - width) / 2;
        const y = (canvas.height - height) / 2;

        ctx.drawImage(sprite, x, y, width, height);
      }

      audioFile.addEventListener("change", async () => {
        const file = audioFile.files[0];

        if (!file) return;

        audio.src = URL.createObjectURL(file);

        lipSync = new LipSyncEngine(audio, {
          attackMs: 35,
          releaseMs: 130,
          noiseFloor: 0.02,

          onUpdate: (openness) => {
            opennessText.textContent = `Openness: ${openness.toFixed(2)}`;

            drawFace(openness);
          },
        });

        await lipSync.attach();
      });

      sprites[0].addEventListener("load", () => {
        drawFace(0);
      });

      sprites[1].addEventListener("load", () => {
        drawFace(0);
      });

      sprites[2].addEventListener("load", () => {
        drawFace(0);
      });

      drawFace(0);
    </script>
  </body>
</html>
