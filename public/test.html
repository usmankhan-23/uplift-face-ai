<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Uplift Faces</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        textarea {
            width: 400px;
            height: 120px;
        }

        canvas {
            border: 1px solid #ccc;
            margin-top: 30px;
        }

        #openness {
            font-size: 24px;
            margin-top: 20px;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Uplift Faces</h1>

    <textarea
        id="text"
        rows="5"
        cols="50"
        placeholder="Type something for Uplift to speak..."
    >آج مارکیٹ میں کیا ریٹ ہے؟</textarea>

    <br /><br />

    <button id="speakButton">Speak</button>

    <p id="status">Ready</p>

    <audio id="audio" controls></audio>

    <br />

    <canvas
        id="canvas"
        width="400"
        height="300"
    ></canvas>

    <div id="openness">Openness: 0.00</div>

    <script src="/lipSync.js"></script>
    <script src="/widget.js"></script>

    <script>
        const textInput =
            document.getElementById("text");

        const speakButton =
            document.getElementById("speakButton");

        const status =
            document.getElementById("status");

        const audio =
            document.getElementById("audio");

        const canvas =
            document.getElementById("canvas");

        const openness =
            document.getElementById("openness");

        let upliftFace = null;

        async function initialize() {
            try {
                upliftFace = await UpliftFace.init({
                    target: canvas,
                    audio: audio,
                    status: status,
                    openness: openness,
                    voiceId: "street-vendor"
                });

                status.textContent = "Ready";
            } catch (error) {
                console.error(error);
                status.textContent =
                    "Error loading Uplift Face.";
            }
        }

        speakButton.addEventListener(
            "click",
            async () => {
                const text =
                    textInput.value.trim();

                if (!text) {
                    status.textContent =
                        "Please enter some text.";

                    return;
                }

                if (!upliftFace) {
                    status.textContent =
                        "Face is still loading.";

                    return;
                }

                speakButton.disabled = true;

                try {
                    await upliftFace.speak(text);
                } catch (error) {
                    console.error(error);

                    status.textContent =
                        "Error generating speech.";
                } finally {
                    speakButton.disabled = false;
                }
            }
        );

        initialize();
    </script>

</body>
</html>
