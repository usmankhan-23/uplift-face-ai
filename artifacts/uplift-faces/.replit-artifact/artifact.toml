kind = "web"
previewPath = "/"
title = "uplift-faces"
description = "An empty React/Vite website workspace for manually configuring a Node.js and Express structure."
version = "1.0.0"
id = "artifacts/uplift-faces"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23939

[services.development]
run = "pnpm --filter @workspace/uplift-faces run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uplift-faces", "run", "build" ]
serve = "static"
publicDir = "artifacts/uplift-faces/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23939"
BASE_PATH = "/"
